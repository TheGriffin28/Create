version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: create-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/create_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - create-net

  db:
    image: postgres:16-alpine
    container_name: create-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=create_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - create-net

volumes:
  pgdata:

networks:
  create-net:
    driver: bridge
