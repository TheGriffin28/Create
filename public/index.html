<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create — Inventory Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: sans-serif; }</style>
</head>
<body class="bg-[#0B0F17] text-white min-h-screen p-6">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    function App() {
      const [items, setItems] = useState([]);
      const [stats, setStats] = useState({});
      useEffect(() => {
        fetch('/api/products').then(r => r.json()).then(d => setItems(d.items || []));
        fetch('/api/stats').then(r => r.json()).then(setStats);
      }, []);
      return (
        <div class="max-w-5xl mx-auto space-y-6">
          <h1 class="text-2xl font-bold">Create Inventory</h1>
          <div class="grid grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">Total: {stats.totalProducts || 0}</div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-emerald-400">In Stock: {stats.inStock || 0}</div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-rose-400">Low Stock: {stats.lowStock || 0}</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
            <table class="w-full text-left text-sm text-slate-300">
              <thead class="bg-slate-950 p-3 border-b border-slate-800">
                <tr><th class="p-3">SKU</th><th class="p-3">Name</th><th class="p-3">Qty</th><th class="p-3">Price</th><th class="p-3">Status</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
                {items.map(i => (
                  <tr key={i.id}><td class="p-3 font-mono text-xs">{i.sku}</td><td class="p-3">{i.name}</td><td class="p-3">{i.quantity}</td><td class="p-3">${i.unitPrice}</td><td class="p-3">{i.status}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
